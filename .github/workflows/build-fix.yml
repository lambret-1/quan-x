name: Novel Content Check

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/novel-check.yml'
      - '.github/workflows/build-fix.yml'
  pull_request:
    paths:
      - '.github/workflows/novel-check.yml'
      - '.github/workflows/build-fix.yml'
  schedule:
    - cron: '0 2 * * *'

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取私密小说仓库
        uses: actions/checkout@v4
        with:
          repository: lambret-1/MyNovels
          token: ${{ secrets.NOVEL_REPO_PAT }}
          path: novel-repo

      # ---------- 1. 敏感词检查（政治类型） ----------
      - name: 敏感词检查
        run: |
          cd novel-repo
          mkdir -p bug

          curl -sSL -o /tmp/words.txt "https://raw.githubusercontent.com/konsheng/Sensitive-lexicon/refs/heads/main/Vocabulary/政治类型.txt"
          if [ ! -s /tmp/words.txt ]; then
            echo "::error::敏感词库下载失败或为空"
            exit 1
          fi

          echo "检查时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > bug/sensitive_words.txt
          echo "----------------------------------------" >> bug/sensitive_words.txt

          if grep -r -n -F -f /tmp/words.txt "《影笔代理人》" --include='*.md' >> bug/sensitive_words.txt; then
            echo "发现敏感词，已写入 bug/sensitive_words.txt"
            echo "HAS_SENSITIVE=1" >> $GITHUB_ENV
          else
            echo "未发现敏感词。" >> bug/sensitive_words.txt
          fi
          exit 0

      # ---------- 2. 沉冗内容检查 ----------
      - name: 沉冗内容检查
        run: |
          cd novel-repo
          python3 - <<'PY'
          import pathlib, re, sys, os, datetime

          ROOT = pathlib.Path('《影笔代理人》')
          MAX_LEN = 200
          issues = []

          for p in sorted(ROOT.rglob('*.md')):
              text = p.read_text(encoding='utf-8', errors='ignore')
              for i, line in enumerate(text.splitlines(), 1):
                  s = line.strip()
                  if not s:
                      continue
                  if len(s) > MAX_LEN:
                      issues.append(f"{p}:{i}: 段落过长（{len(s)} 字）")
                  match = re.search(r'(.{2,6})\1{2,}', s)
                  if match:
                      issues.append(f"{p}:{i}: 疑似重复表达（重复内容：'{match.group(0)}'）")

          bug_dir = pathlib.Path('bug')
          bug_dir.mkdir(exist_ok=True)
          report_file = bug_dir / 'redundancy.txt'

          current_time = datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%d %H:%M:%S UTC')
          content = f"检查时间: {current_time}\n----------------------------------------\n"
          
          if issues:
              content += "\n".join(issues)
              print("发现沉冗或重复内容，已写入 bug/redundancy.txt")
              with open(os.environ['GITHUB_ENV'], 'a') as f:
                  f.write("HAS_REDUNDANCY=1\n")
          else:
              content += "未发现沉冗问题"
              print("沉冗检查通过。")

          report_file.write_text(content, encoding='utf-8')
          PY
          exit 0

      # ---------- 3. 反 AI 味检测（优化版，只输出有效结果，精简路径） ----------
      - name: 反 AI 味检测
        run: |
          cd novel-repo
          mkdir -p bug
          echo "检查时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > bug/ai_slop.txt
          echo "----------------------------------------" >> bug/ai_slop.txt

          npx wsc-lint check "《影笔代理人》/**/*.md" --format json > /tmp/wsc_output.json 2>/dev/null || true

          python3 - <<'PY'
          import json, pathlib, os

          with open('/tmp/wsc_output.json', encoding='utf-8') as f:
              try:
                  data = json.load(f)
              except:
                  data = []

          bug_dir = pathlib.Path('bug')
          report_file = bug_dir / 'ai_slop.txt'

          # wsc-lint 的输出通常是 { "文件路径": [ {line, rule, message}, ... ] }
          # 我们遍历字典，过滤掉空数组
          has_issue = False
          if isinstance(data, dict):
              for file_path, warnings in data.items():
                  if not warnings:  # 跳过没有警告的文件
                      continue
                  # 清理路径：去掉 CI 环境的前缀
                  clean_path = file_path.replace('/home/runner/work/quan-x/quan-x/novel-repo/', '')
                  for warn in warnings:
                      line = warn.get('line', '')
                      rule = warn.get('rule', '')
                      message = warn.get('message', '')
                      with open(report_file, 'a', encoding='utf-8') as out:
                          out.write(f"{clean_path}:{line}: [{rule}] {message}\n")
                      has_issue = True
          # 兼容 wsc-lint 直接返回列表的情
          elif isinstance(data, list):
              for item in data:
                  file_path = item.get('file', '')
                  # 同样清理路径
                  clean_path = file_path.replace('/home/runner/work/quan-x/quan-x/novel-repo/', '')
                  line = item.get('line', '')
                  rule = item.get('rule', '')
                  message = item.get('message', '')
                  with open(report_file, 'a', encoding='utf-8') as out:
                      out.write(f"{clean_path}:{line}: [{rule}] {message}\n")
                  has_issue = True

          if has_issue:
              print("发现 AI 写作特征，已精简写入 bug/ai_slop.txt")
              with open(os.environ['GITHUB_ENV'], 'a') as f:
                  f.write("HAS_AISLOP=1\n")
          else:
              with open(report_file, 'a', encoding='utf-8') as out:
                  out.write("未发现 AI 写作特征（或工具对中文支持有限）\n")
              print("反 AI 味检测通过")
          PY
          exit 0

      # ---------- 4. 提交并推送 bug 报告 ----------
      - name: 提交并推送 bug 报告到私有仓库
        run: |
          cd novel-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bug/
          git commit -m "chore: 自动更新检查报告 [skip ci]"
          git push

      # ---------- 5. 最终状态检查 ----------
      - name: 最终状态检查
        run: |
          HAS_ISSUE=0
          [ "$HAS_SENSITIVE" = "1" ] && HAS_ISSUE=1 && echo "::warning::发现敏感词"
          [ "$HAS_REDUNDANCY" = "1" ] && HAS_ISSUE=1 && echo "::warning::发现沉冗内容"
          [ "$HAS_AISLOP" = "1" ] && HAS_ISSUE=1 && echo "::warning::发现 AI 写作特征"

          if [ "$HAS_ISSUE" = "1" ]; then
            echo "::error::检查发现内容问题，请查看 novel-repo/bug/ 目录。"
            exit 1
          fi
          echo "全部检查通过。"