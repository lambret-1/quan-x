name: Novel Content Check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'   # 每天凌晨2点自动跑一次

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取私密小说仓库
        uses: actions/checkout@v4
        with:
          repository: lambret-1/MyNovels
          token: ${{ secrets.NOVEL_REPO_PAT }}
          path: novel-repo

      - name: 敏感词检查
        run: |
          cd novel-repo
          mkdir -p bug

          # 1. 下载词库
          git clone --depth 1 https://github.com/konsheng/Sensitive-lexicon.git /tmp/sensitive
          find /tmp/sensitive -name '*.txt' -exec cat {} + | sort -u > /tmp/words.txt

          # 2. 生成内置白名单（过滤高频误报词，可按需增加）
          cat << 'EOF' > /tmp/builtin_whitelist.txt
          女人
          男人
          手
          死
          血
          钱
          抓
          发白
          眼神
          心里
          影子
          影子
          影痕
          画室
          沈砚
          苏听晚
          EOF

          # 3. 合并外部白名单（如果存在）
          if [ -f .github/sensitive-whitelist.txt ]; then
            cat .github/sensitive-whitelist.txt >> /tmp/builtin_whitelist.txt
          fi

          # 4. 从词库中剔除白名单词汇
          # 注意：这会过滤掉词库中包含这些词的条目，极大降低误报
          grep -v -F -f /tmp/builtin_whitelist.txt /tmp/words.txt > /tmp/words.filtered.txt

          echo "过滤后词库条数: $(wc -l < /tmp/words.filtered.txt)"

          # 5. 扫描小说，生成报告
          if grep -r -n -F -f /tmp/words.filtered.txt "《影笔代理人》" --include='*.md' \
             > bug/sensitive_words.txt; then
            echo "发现敏感词，已写入 bug/sensitive_words.txt"
            echo "HAS_SENSITIVE=1" >> $GITHUB_ENV
          else
            echo "未发现敏感词。"
            rm -f bug/sensitive_words.txt
          fi
          exit 0

      - name: 沉冗内容检查
        run: |
          cd novel-repo
          python3 - <<'PY'
          import pathlib, re, sys

          ROOT = pathlib.Path('《影笔代理人》')
          MAX_LEN = 200
          issues = []

          for p in sorted(ROOT.rglob('*.md')):
              text = p.read_text(encoding='utf-8', errors='ignore')
              for i, line in enumerate(text.splitlines(), 1):
                  s = line.strip()
                  if not s:
                      continue
                  if len(s) > MAX_LEN:
                      issues.append(f"{p}:{i}: 段落过长（{len(s)} 字）")
                  if re.search(r'(.{2,6})\1{2,}', s):
                      issues.append(f"{p}:{i}: 疑似重复表的达")

          if issues:
              bug_dir = pathlib.Path('bug')
              bug_dir.mkdir(exist_ok=True)
              (bug_dir / 'redundancy.txt').write_text("\n".join(issues), encoding='utf-8')
              print("发现沉冗或重复内容，已写入 bug/redundancy.txt")
              sys.exit(0)
          print("沉冗检查通过。")
          PY
          if [ -f bug/redundancy.txt ]; then
            echo "HAS_REDUNDANCY=1" >> $GITHUB_ENV
          fi
          exit 0

      - name: 提交并推送 bug 报告到私有仓库
        if: env.HAS_SENSITIVE == '1' || env.HAS_REDUNDANCY == '1'
        run: |
          cd novel-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bug/
          git commit -m "chore: 自动更新检查报告 [skip ci]" || echo "没有变更需要提交"
          git push

      - name: 最终状态检查
        run: |
          if [ -f novel-repo/bug/sensitive_words.txt ] || [ -f novel-repo/bug/redundancy.txt ]; then
            echo "::error::检查发现内容问题，请查看 novel-repo/bug/ 目录。"
            exit 1
          fi
          echo "全部检查通过。"