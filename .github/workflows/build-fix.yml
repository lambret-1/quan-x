name: 编译iOS16闪退修复

on:
  workflow_dispatch:
  push:
    paths:
      - 'fix_ios16_crash/**'
      - '.github/workflows/build-fix.yml'

jobs:
  build-fix:
    runs-on: macos-14
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          brew install ldid xz
          sudo xcode-select -switch /Applications/Xcode.app
          xcodebuild -version

      - name: 安装 Theos
        run: |
          export THEOS=~/theos
          git clone --recursive --depth 1 https://github.com/theos/theos.git $THEOS
          # 使用 Xcode 自带 iOS SDK，无需额外下载
          ls $THEOS/sdks/ || true
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "THEOS_DEVICE_IP=" >> $GITHUB_ENV

      - name: 编译 Tweak dylib
        run: |
          cd fix_ios16_crash/tweak
          make clean package FINAL=1 THEOS=~/theos 2>&1
          ls -la packages/

      - name: 提取 dylib
        run: |
          cd fix_ios16_crash/tweak
          # 直接从Theos编译输出目录复制dylib
          DYLIB=$(find .theos -name "QXFix.dylib" | head -1)
          if [ -z "$DYLIB" ]; then
            echo "错误: 未找到编译输出的QXFix.dylib"
            find .theos -name "*.dylib" 2>/dev/null || true
            exit 1
          fi
          cp "$DYLIB" "${GITHUB_WORKSPACE}/QXFix.dylib"
          echo "DYLIB_PATH=QXFix.dylib" >> $GITHUB_ENV
          echo "找到 dylib: $DYLIB"
          file "${GITHUB_WORKSPACE}/QXFix.dylib"
          ls -la "${GITHUB_WORKSPACE}/QXFix.dylib"
          otool -L "${GITHUB_WORKSPACE}/QXFix.dylib"

      - name: 下载原始 IPA
        run: |
          curl -sL -o Quan_original.b64 "https://raw.githubusercontent.com/lambret-1/quan-x/main/docs/Quantumult%20X_1.5.0(1).ipa"
          base64 -D -i Quan_original.b64 -o Quan_original.ipa
          ls -la Quan_original.ipa

      - name: 安装注入工具
        run: |
          # 编译 insert_dylib（比 optool 更可靠）
          git clone --depth 1 https://github.com/Tyilo/insert_dylib.git /tmp/insert_dylib
          cd /tmp/insert_dylib
          xcodebuild -project insert_dylib.xcodeproj -configuration Release build CONFIGURATION_BUILD_DIR=/tmp/insert_dylib/build 2>&1 | tail -3
          cp /tmp/insert_dylib/build/insert_dylib /usr/local/bin/
          insert_dylib --help 2>&1 | head -3 || true

      - name: 解压 IPA 并注入 dylib
        run: |
          mkdir -p /tmp/ipa_work
          cd /tmp/ipa_work
          unzip -qo "${GITHUB_WORKSPACE}/Quan_original.ipa"
          APP="Payload/Quantumult X.app"
          
          # 复制 dylib
          cp "${GITHUB_WORKSPACE}/${{ env.DYLIB_PATH }}" "$APP/QXFix.dylib"
          
          # 注入加载命令（insert_dylib用法: dylib_path binary_path [new_binary_path]）
          BINARY="$APP/Quantumult X"
          echo "=== 注入前二进制信息 ==="
          file "$BINARY"
          ls -la "$BINARY"
          echo "=== 执行注入 ==="
          insert_dylib "@executable_path/QXFix.dylib" "$BINARY" "$BINARY.patched" 2>&1
          INJECT_EXIT=$?
          echo "insert_dylib 退出码: $INJECT_EXIT"
          if [ -f "$BINARY.patched" ]; then
            mv "$BINARY.patched" "$BINARY"
            echo "注入文件已替换"
          else
            echo "错误: 未生成patched文件"
            ls -la "$APP/"
            exit 1
          fi
          
          # 验证注入
          echo "=== 验证加载命令 ==="
          otool -L "$BINARY"
          echo "=== 检查QXFix ==="
          otool -L "$BINARY" | grep -i qxfix && echo "注入验证成功" || echo "警告: 未找到QXFix加载命令"
          
          # 移除旧签名（未签名IPA，移除_CodeSignature）
          rm -rf "$APP/_CodeSignature"
          
          # 重新打包
          rm -f "${GITHUB_WORKSPACE}/QuantumultX_1.5.0_iOS16_fixed.ipa"
          zip -qr "${GITHUB_WORKSPACE}/QuantumultX_1.5.0_iOS16_fixed.ipa" Payload
          ls -la "${GITHUB_WORKSPACE}/QuantumultX_1.5.0_iOS16_fixed.ipa"

      - name: 上传修复后 IPA
        uses: actions/upload-artifact@v4
        with:
          name: QuantumultX_1.5.0_iOS16_fixed
          path: QuantumultX_1.5.0_iOS16_fixed.ipa
          retention-days: 30

      - name: 上传 dylib
        uses: actions/upload-artifact@v4
        with:
          name: QXFix.dylib
          path: ${{ env.DYLIB_PATH }}
          retention-days: 30
