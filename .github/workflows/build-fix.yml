name: Novel Content Check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取私密小说仓库
        uses: actions/checkout@v4
        with:
          repository: lambret-1/MyNovels
          token: ${{ secrets.NOVEL_REPO_PAT }}
          path: novel-repo

      - name: 敏感词检查
        run: |
          cd novel-repo
          mkdir -p bug

          # 1. 下载指定的网易前端过滤敏感词库
          curl -sSL -o /tmp/words.txt "https://raw.githubusercontent.com/konsheng/Sensitive-lexicon/refs/heads/main/Vocabulary/网易前端过滤敏感词库.txt"
          if [ ! -s /tmp/words.txt ]; then
            echo "::error::敏感词库下载失败或为空"
            exit 1
          fi

          # 2. 内置白名单
          cat << 'EOF' > /tmp/whitelist.txt
          女人
          男人
          孩子
          老人
          母亲
          父亲
          儿子
          女儿
          丈夫
          妻子
          婆婆
          爷爷
          奶奶
          手
          脚
          头
          脸
          眼睛
          嘴
          心
          抓
          握
          拿
          放
          走
          跑
          看
          说
          钱
          碗
          筷子
          桌子
          椅子
          灯
          画
          纸
          笔
          影子
          墨痕
          影契
          画室
          沈砚
          苏听晚
          陈婆婆
          正午
          阳光
          黄昏
          路灯
          老樟树
          梧水街
          一心堂
          死
          血
          杀
          尸
          骨
          痛
          伤
          打
          骂
          撕
          咬
          吞
          咽
          鬼
          魂
          命
          活着
          死亡
          血腥
          残忍
          恶
          黑暗
          阴冷
          挣扎
          嘶叫
          剥离
          代价
          诅咒
          绝望
          恐惧
          害怕
          疯狂
          崩溃
          窒息
          颤抖
          尖叫
          愤怒
          仇恨
          悲伤
          哭泣
          眼泪
          心脏
          胸口
          呼吸
          身体
          皮肤
          血管
          EOF

          # 3. 过滤词库
          grep -v -F -f /tmp/whitelist.txt /tmp/words.txt > /tmp/words.filtered.txt
          echo "过滤后词库条数: $(wc -l < /tmp/words.filtered.txt)"

          # 4. 扫描小说，总是写入报告文件
          if grep -r -n -F -f /tmp/words.filtered.txt "《影笔代理人》" --include='*.md' > bug/sensitive_words.txt; then
            echo "发现敏感词，已写入 bug/sensitive_words.txt"
            echo "HAS_SENSITIVE=1" >> $GITHUB_ENV
          else
            echo "未发现敏感词。"
            echo "未发现敏感词" > bug/sensitive_words.txt
          fi
          exit 0

      - name: 沉冗内容检查
        run: |
          cd novel-repo
          python3 - <<'PY'
          import pathlib, re, sys, os

          ROOT = pathlib.Path('《影笔代理人》')
          MAX_LEN = 200
          issues = []

          for p in sorted(ROOT.rglob('*.md')):
              text = p.read_text(encoding='utf-8', errors='ignore')
              for i, line in enumerate(text.splitlines(), 1):
                  s = line.strip()
                  if not s:
                      continue
                  if len(s) > MAX_LEN:
                      issues.append(f"{p}:{i}: 段落过长（{len(s)} 字）")
                  if re.search(r'(.{2,6})\1{2,}', s):
                      issues.append(f"{p}:{i}: 疑似重复表达")

          bug_dir = pathlib.Path('bug')
          bug_dir.mkdir(exist_ok=True)
          report_file = bug_dir / 'redundancy.txt'

          if issues:
              report_file.write_text("\n".join(issues), encoding='utf-8')
              print("发现沉冗或重复内容，已写入 bug/redundancy.txt")
              with open(os.environ['GITHUB_ENV'], 'a') as f:
                  f.write("HAS_REDUNDANCY=1\n")
          else:
              report_file.write_text("未发现沉冗问题", encoding='utf-8')
              print("沉冗检查通过。")
          PY
          exit 0

      - name: 生成时间戳日志（保证每次都有文件变化）
        run: |
          cd novel-repo
          echo "本次检查时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > bug/check_log.txt

      - name: 提交并推送 bug 报告到私有仓库
        run: |
          cd novel-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bug/
          git commit -m "chore: 自动更新检查报告 [skip ci]"
          git push

      - name: 最终状态检查
        run: |
          if [ "$HAS_SENSITIVE" = "1" ] || [ "$HAS_REDUNDANCY" = "1" ]; then
            echo "::error::检查发现到内容问题，请查看 novel-repo/bug/ 目录。"
            exit 1
          fi
          echo "全部检查通过。"