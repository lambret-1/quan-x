name: Novel Content Check

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/novel-check.yml'
      - '.github/workflows/build-fix.yml'
  pull_request:
    paths:
      - '.github/workflows/novel-check.yml'
      - '.github/workflows/build-fix.yml'
  schedule:
    - cron: '0 2 * * *'

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取私密小说仓库
        uses: actions/checkout@v4
        with:
          repository: lambret-1/MyNovels
          token: ${{ secrets.NOVEL_REPO_PAT }}
          path: novel-repo

      - name: 安装 Python 依赖
        run: |
          pip install zh-narrative-guard pycorrector torch --index-url https://download.pytorch.org/whl/cpu

      # ---------- 1. 敏感词检查（政治类型） ----------
      - name: 敏感词检查
        run: |
          cd novel-repo
          mkdir -p bug

          curl -sSL -o /tmp/words.txt "https://raw.githubusercontent.com/konsheng/Sensitive-lexicon/refs/heads/main/Vocabulary/政治类型.txt"
          if [ ! -s /tmp/words.txt ]; then
            echo "::error::敏感词库下载失败或为空"
            exit 1
          fi

          echo "词库条数: $(wc -l < /tmp/words.txt)"

          echo "检查时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > bug/sensitive_words.txt
          echo "----------------------------------------" >> bug/sensitive_words.txt

          if grep -r -n -F -f /tmp/words.txt "《影笔代理人》" --include='*.md' >> bug/sensitive_words.txt; then
            echo "发现敏感词，已写入 bug/sensitive_words.txt"
            echo "HAS_SENSITIVE=1" >> $GITHUB_ENV
          else
            echo "未发现敏感词。" >> bug/sensitive_words.txt
          fi
          exit 0

      # ---------- 2. 沉冗内容检查 ----------
      - name: 沉冗内容检查
        run: |
          cd novel-repo
          python3 - <<'PY'
          import pathlib, re, sys, os, datetime

          ROOT = pathlib.Path('《影笔代理人》')
          MAX_LEN = 200
          issues = []

          for p in sorted(ROOT.rglob('*.md')):
              text = p.read_text(encoding='utf-8', errors='ignore')
              for i, line in enumerate(text.splitlines(), 1):
                  s = line.strip()
                  if not s:
                      continue
                  if len(s) > MAX_LEN:
                      issues.append(f"{p}:{i}: 段落过长（{len(s)} 字）")
                  match = re.search(r'(.{2,6})\1{2,}', s)
                  if match:
                      issues.append(f"{p}:{i}: 疑似重复表达（重复内容：'{match.group(0)}'）")

          bug_dir = pathlib.Path('bug')
          bug_dir.mkdir(exist_ok=True)
          report_file = bug_dir / 'redundancy.txt'

          current_time = datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%d %H:%M:%S UTC')
          content = f"检查时间: {current_time}\n----------------------------------------\n"
          
          if issues:
              content += "\n".join(issues)
              print("发现沉冗或重复内容，已写入 bug/redundancy.txt")
              with open(os.environ['GITHUB_ENV'], 'a') as f:
                  f.write("HAS_REDUNDANCY=1\n")
          else:
              content += "未发现沉冗问题"
              print("沉冗检查通过。")

          report_file.write_text(content, encoding='utf-8')
          PY
          exit 0

      # ---------- 3. 反 AI 味检测 ----------
      - name: 反 AI 味检测
        run: |
          cd novel-repo
          mkdir -p bug
          echo "检查时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > bug/ai_slop.txt
          echo "----------------------------------------" >> bug/ai_slop.txt

          npx wsc-lint check "《影笔代理人》/**/*.md" --format json > /tmp/wsc_output.json 2>/dev/null || true

          python3 - <<'PY'
          import json, pathlib, os

          with open('/tmp/wsc_output.json', encoding='utf-8') as f:
              try:
                  data = json.load(f)
              except:
                  data = []

          bug_dir = pathlib.Path('bug')
          report_file = bug_dir / 'ai_slop.txt'

          if data:
              with open(report_file, 'a', encoding='utf-8') as out:
                  for item in data:
                      file = item.get('file', '')
                      line = item.get('line', '')
                      rule = item.get('rule', '')
                      message = item.get('message', '')
                      out.write(f"{file}:{line}: [{rule}] {message}\n")
              print(f"发现 {len(data)} 处 AI 写作特征")
              with open(os.environ['GITHUB_ENV'], 'a') as f:
                  f.write("HAS_AISLOP=1\n")
          else:
              with open(report_file, 'a', encoding='utf-8') as out:
                  out.write("未发现 AI 写作特征\n")
              print("反 AI 味检测通过")
          PY
          exit 0

      # ---------- 4. 叙事一致性检查----------
      - name: 叙事一致性检查
        run: |
          cd novel-repo
          mkdir -p bug
          echo "检查时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > bug/consistency.txt
          echo "----------------------------------------" >> bug/consistency.txt

          python3 - <<'PY'
          import pathlib, os
          try:
              from zh_narrative_guard import (
                  detect_weekday_violations,
                  detect_cliche_violations,
              )
          except Exception as e:
              print(f"跳过叙事一致性检查: {e}")
              with open('bug/consistency.txt', 'a', encoding='utf-8') as out:
                  out.write("工具加载失败，已跳过。\n")
              exit(0)

          ROOT = pathlib.Path('《影笔代理人》')
          issues = []

          for p in sorted(ROOT.rglob('*.md')):
              text = p.read_text(encoding='utf-8', errors='ignore')
              for i, line in enumerate(text.splitlines(), 1):
                  s = line.strip()
                  if not s:
                      continue
                  for v in detect_weekday_violations(s):
                      issues.append(f"{p}:{i}: 时间线矛盾（声称'{v['claimed_name']}'，应为'{v['expected_name']}'）")
                  for c in detect_cliche_violations(s):
                      issues.append(f"{p}:{i}: 陈词滥调（'{c}'）")

          bug_dir = pathlib.Path('bug')
          report_file = bug_dir / 'consistency.txt'

          if issues:
              with open(report_file, 'a', encoding='utf-8') as out:
                  out.write("\n".join(issues))
              print(f"发现 {len(issues)} 处叙事一致性问题")
              with open(os.environ['GITHUB_ENV'], 'a') as f:
                  f.write("HAS_CONSISTENCY=1\n")
          else:
              with open(report_file, 'a', encoding='utf-8') as out:
                  out.write("未发现叙事一致性问题")
              print("叙事一致性检查通过")
          PY
          exit 0

      # ---------- 5. 语法纠错 ----------
      - name: 语法纠错
        run: |
          cd novel-repo
          mkdir -p bug
          echo "检查时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > bug/spelling.txt
          echo "----------------------------------------" >> bug/spelling.txt

          python3 - <<'PY'
          import pathlib, os
          
          try:
              from pycorrector import Corrector
              corrector = Corrector()
          except Exception as e:
              print(f"跳过语法纠错（依赖或模型加载失败）: {e}")
              with open('bug/spelling.txt', 'a', encoding='utf-8') as out:
                  out.write("语法纠错工具未能初始化，已跳过。\n")
              exit(0)

          ROOT = pathlib.Path('《影笔代理人》')
          issues = []

          for p in sorted(ROOT.rglob('*.md')):
              text = p.read_text(encoding='utf-8', errors='ignore')
              for i, line in enumerate(text.splitlines(), 1):
                  s = line.strip()
                  if not s or len(s) < 5:
                      continue
                  try:
                      corrected, details = corrector.correct(s)
                      if details:
                          for d in details:
                              issues.append(f"{p}:{i}: 疑似错误（'{d[0]}' → '{d[1]}'）")
                  except:
                      pass

          bug_dir = pathlib.Path('bug')
          report_file = bug_dir / 'spelling.txt'

          if issues:
              with open(report_file, 'a', encoding='utf-8') as out:
                  out.write("\n".join(issues))
              print(f"发现 {len(issues)} 处疑似语法/用字错误")
              with open(os.environ['GITHUB_ENV'], 'a') as f:
                  f.write("HAS_SPELLING=1\n")
          else:
              with open(report_file, 'a', encoding='utf-8') as out:
                  out.write("未发现语法/用字错误")
              print("语法纠错检查通过")
          PY
          exit 0

      # ---------- 6. 提交并推送 bug 报告 ----------
      - name: 提交并推送 bug 报告到私有仓库
        run: |
          cd novel-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bug/
          git commit -m "chore: 自动更新检查报告 [skip ci]"
          git push

      # ---------- 7. 最终状态检查 ----------
      - name: 最终状态检查
        run: |
          HAS_ISSUE=0
          [ "$HAS_SENSITIVE" = "1" ] && HAS_ISSUE=1 && echo "::warning::发现敏感词"
          [ "$HAS_REDUNDANCY" = "1" ] && HAS_ISSUE=1 && echo "::warning::发现沉冗内容"
          [ "$HAS_AISLOP" = "1" ] && HAS_ISSUE=1 && echo "::warning::发现 AI 写作特征"
          [ "$HAS_CONSISTENCY" = "1" ] && HAS_ISSUE=1 && echo "::warning::发现叙事一致性问题"
          [ "$HAS_SPELLING" = "1" ] && HAS_ISSUE=1 && echo "::warning::发现语法/用字错误"

          if [ "$HAS_ISSUE" = "1" ]; then
            echo "::error::检查发现内容问题，请查看 novel-repo/bug/ 目录。"
            exit 1
          fi
          echo "全部检查通过。"